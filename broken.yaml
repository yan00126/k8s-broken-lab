apiVersion: v1
kind: Namespace
metadata: {name: lab}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: app-config, namespace: lab}
data:
  MESSAGE: "hello from configmap"
---
apiVersion: v1
kind: Secret
metadata: {name: db-secret, namespace: lab}
type: Opaque
stringData:
  password: "s3cret"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: lab}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports: [{containerPort: 80}]
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 5
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: lab}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: web, namespace: lab}
spec:
  ingressClassName: nginx
  rules:
  - host: web.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: {name: web-svc, port: {number: 80}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh","-c","[ -n \"$DB_PASSWORD\" ] || { echo 'FATAL: DB_PASSWORD is empty'; exit 1; }; echo \"$MESSAGE\"; sleep 3600"]
        env:
        - name: MESSAGE
          valueFrom: {configMapKeyRef: {name: app-config, key: MESSAGE}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: db-secret, key: password, optional: true}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cache, namespace: lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: cache}}
  template:
    metadata: {labels: {app: cache}}
    spec:
      containers:
      - name: cache
        image: python:3.12-alpine
        command: ["python","-c","import time; x=b'x'*(200*1024*1024); print('cache warmed'); time.sleep(3600)"]
        resources:
          limits: {memory: 300Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: report, namespace: lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: report}}
  template:
    metadata: {labels: {app: report}}
    spec:
      containers:
      - name: report
        image: busybox:1.36
        command: ["sleep","3600"]
        resources:
          requests: {cpu: 100m}
